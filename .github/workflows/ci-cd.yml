name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check local assets exist
        # Static export has no server: any src/href to a missing file (e.g. /_next/image) is a broken asset.
        run: |
          missing=0
          for u in $(grep -ohE '(src|href|srcSet)="/[^"#?, ]*' out/*.html | sed -E 's/^[a-zA-Z]+="//' | sort -u); do
            [ -e "out$u" ] || [ -e "out$u.html" ] || { echo "missing: $u"; missing=1; }
          done
          exit $missing
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: out
          path: out
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-landing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload site
        run: rsync -az --delete out/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/hesta-landing/"
      - name: Smoke test
        run: |
          curl -fsS https://hesta.homes/ | grep -q '<title>HESTA'
          curl -fsS -o /dev/null https://hesta.homes/en
          curl -fsS -o /dev/null https://hesta.homes/screens/security-center.png
